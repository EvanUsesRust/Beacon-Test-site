<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIMLAPI Image Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --border: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(960px, 100%);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    input, select, textarea, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1220;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 20px;
    }

    .gallery {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #020617;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>AI Image Generator</h1>
    <p class="sub">Run this in Codespaces, paste your AIMLAPI key, and generate images from prompts.</p>

    <div class="grid">
      <div>
        <label for="apiKey">AIMLAPI Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
      </div>
      <div>
        <label for="model">Model</label>
        <input id="model" type="text" value="stabilityai/stable-diffusion-xl-base-1.0" />
      </div>
      <div>
        <label for="size">Image Size</label>
        <select id="size">
          <option value="1024x1024">1024x1024</option>
          <option value="768x768">768x768</option>
          <option value="512x512">512x512</option>
        </select>
      </div>
      <div>
        <label for="count">Count</label>
        <select id="count">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
    </div>

    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Cinematic futuristic city at sunrise with flying vehicles"></textarea>

    <button id="generateBtn" type="button">Generate Image</button>
    <p id="status"></p>

    <section class="gallery" id="gallery" aria-live="polite"></section>
  </main>

  <script>
    const apiUrl = 'https://api.aimlapi.com/v1/images/generations';

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function renderImages(items) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      items.forEach((item, index) => {
        const img = document.createElement('img');
        if (item.url) {
          img.src = item.url;
        } else if (item.b64_json) {
          img.src = `data:image/png;base64,${item.b64_json}`;
        }
        img.alt = `Generated image ${index + 1}`;
        gallery.appendChild(img);
      });
    }

    async function generateImage() {
      const key = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const model = document.getElementById('model').value.trim();
      const size = document.getElementById('size').value;
      const n = Number(document.getElementById('count').value);
      const button = document.getElementById('generateBtn');

      if (!key) {
        setStatus('Enter your AIMLAPI key first.');
        return;
      }
      if (!prompt) {
        setStatus('Enter a prompt first.');
        return;
      }

      button.disabled = true;
      setStatus('Generating image(s)...');

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + key,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model,
            prompt,
            size,
            n
          })
        });

        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload?.error?.message || payload?.message || 'Request failed');
        }

        if (!Array.isArray(payload.data) || payload.data.length === 0) {
          throw new Error('No images returned by the API.');
        }

        renderImages(payload.data);
        setStatus(`Done. Generated ${payload.data.length} image(s).`);
      } catch (error) {
        console.error(error);
        setStatus(`Error: ${error.message}`);
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('generateBtn').addEventListener('click', generateImage);
  </script>
</body>
</html>
